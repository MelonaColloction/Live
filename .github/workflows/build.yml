name: Build Story of an Empire Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v5


      # ==========================================
      # NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24


      # ==========================================
      # JAVA
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''


      # ==========================================
      # INSTALL ANDROID PACKAGES
      # ==========================================
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "Android SDK packages installed."


      # ==========================================
      # PREPARE APP
      # ==========================================
      - name: Prepare app
        run: |
          test -f index.html
          test -f story.txt
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          cp story.txt www/story.txt
          if [ -d "images" ]; then
            cp -r images www/images
            echo "Images copied."
          fi
          if [ -f "icon.png" ]; then
            cp icon.png www/icon.png
            echo "Icon copied."
          fi
          echo "App prepared."
          echo "--- Contents of www ---"
          ls -la www


      # ==========================================
      # CREATE PACKAGE.JSON
      # ==========================================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "story-of-an-empire",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF


      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: |
          npm install


      # ==========================================
      # CREATE CAPACITOR CONFIG
      # ==========================================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.storyofanempire.app",
            "appName": "Story of an Empire",
            "webDir": "www"
          }
          EOF


      # ==========================================
      # ADD ANDROID
      # ==========================================
      - name: Add Android
        run: |
          npx cap add android


      # ==========================================
      # ENABLE IMMERSIVE FULLSCREEN
      # ==========================================
      - name: Enable Fullscreen
        run: |
          python3 - <<'PY'
          import os
          import re

          base = "android/app/src/main/java"
          main_activity = None

          for root, dirs, files in os.walk(base):
              if "MainActivity.java" in files:
                  main_activity = os.path.join(root, "MainActivity.java")
                  break

          if not main_activity:
              raise SystemExit("MainActivity.java not found.")

          with open(main_activity, "r", encoding="utf-8") as f:
              original = f.read()

          package_match = re.search(
              r'^\s*package\s+([^;]+);',
              original, re.MULTILINE
          )

          if not package_match:
              raise SystemExit("Package name not found.")

          package_name = package_match.group(1)

          fullscreen_activity = f'''package {package_name};

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{

              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }}
          }}
          '''

          with open(main_activity, "w", encoding="utf-8") as f:
              f.write(fullscreen_activity)

          print("Fullscreen MainActivity created.")
          PY


      # ==========================================
      # SYNC ANDROID
      # ==========================================
      - name: Sync Android
        run: |
          npx cap sync android


      # ==========================================
      # VERSION
      # ==========================================
      - name: Set version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((RUN_NUMBER + 100))
          VERSION_NAME="1.0.${RUN_NUMBER}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"


      # ==========================================
      # LOAD KEYSTORE
      # ==========================================
      - name: Load existing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > StoryOfAnEmpire.keystore
          test -s StoryOfAnEmpire.keystore
          mkdir -p android/app
          cp StoryOfAnEmpire.keystore android/app/StoryOfAnEmpire.keystore
          echo "Keystore loaded."


      # ==========================================
      # CONFIGURE SIGNING PROPERTIES
      # ==========================================
      - name: Configure signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"

          ALIAS=$(keytool -list -keystore android/app/StoryOfAnEmpire.keystore \
            -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | grep "PrivateKeyEntry" \
            | head -n 1 \
            | cut -d',' -f1 \
            | xargs)

          if [ -z "$ALIAS" ]; then
            echo "❌ No PrivateKeyEntry alias found!"
            exit 1
          fi

          echo "✅ AUTO-DETECTED ALIAS: $ALIAS"
          echo "DETECTED_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

          cat >> android/gradle.properties <<EOF

          AIRDROP_KEYSTORE_FILE=StoryOfAnEmpire.keystore
          AIRDROP_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          AIRDROP_KEY_ALIAS=${ALIAS}
          AIRDROP_KEY_PASSWORD=${KEYSTORE_PASSWORD}
          EOF

          echo "Signing properties configured."


      # ==========================================
      # CONFIGURE ANDROID GRADLE
      # ==========================================
      - name: Configure Android Gradle
        run: |
          python3 - <<'PY'
          import re
          import os

          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.storyofanempire.app"', text, count=1)
          text = re.sub(r'compileSdk\s+\d+', 'compileSdk 35', text, count=1)

          if re.search(r'minSdkVersion\s+rootProject\.ext\.minSdkVersion', text):
              text = re.sub(
                  r'minSdkVersion\s+rootProject\.ext\.minSdkVersion',
                  'minSdkVersion 23',
                  text, count=1
              )
          else:
              text = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 23', text, count=1)

          text = re.sub(r'targetSdkVersion\s+rootProject\.ext\.targetSdkVersion', 'targetSdkVersion 35', text, count=1)
          text = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 35', text, count=1)

          text = re.sub(r'versionCode\s+\d+', 'versionCode ' + os.environ["VERSION_CODE"], text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "' + os.environ["VERSION_NAME"] + '"', text, count=1)

          text = re.sub(
              r'\n\s*signingConfigs\s*\{.*?\n\s*\}\s*(?=\n\s*buildTypes)',
              '', text, count=1, flags=re.S
          )

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(AIRDROP_KEYSTORE_FILE)
                      storePassword AIRDROP_KEYSTORE_PASSWORD
                      keyAlias AIRDROP_KEY_ALIAS
                      keyPassword AIRDROP_KEY_PASSWORD
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

          '''

          if "signingConfigs {" not in text:
              text = text.replace("    buildTypes {", signing_block + "    buildTypes {", 1)

          release_pattern = r'(buildTypes\s*\{\s*release\s*\{)'
          if "signingConfig signingConfigs.release" not in text:
              text = re.sub(
                  release_pattern,
                  r'\1\n            signingConfig signingConfigs.release',
                  text, count=1, flags=re.S
              )

          if re.search(r'buildTypes\s*\{.*?release\s*\{', text, re.S):
              release_match = re.search(
                  r'(buildTypes\s*\{\s*release\s*\{)(.*?)(\n\s*\})',
                  text, re.S
              )
              if release_match:
                  release_body = release_match.group(2)
                  if "minifyEnabled" in release_body:
                      release_body = re.sub(r'minifyEnabled\s+\w+', 'minifyEnabled false', release_body, count=1)
                  else:
                      release_body = "\n            minifyEnabled false" + release_body
                  text = text[:release_match.start(2)] + release_body + text[release_match.end(2):]

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Android Gradle configured.")
          PY


      # ==========================================
      # CLEAN UNNECESSARY PERMISSIONS
      # ==========================================
      - name: Clean unnecessary permissions
        run: |
          python3 - <<'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          permissions = [
              "READ_CONTACTS", "WRITE_CONTACTS", "READ_SMS", "SEND_SMS",
              "RECEIVE_SMS", "CALL_PHONE", "READ_PHONE_STATE",
              "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION",
              "CAMERA", "RECORD_AUDIO",
              "READ_EXTERNAL_STORAGE", "WRITE_EXTERNAL_STORAGE",
              "MANAGE_EXTERNAL_STORAGE", "REQUEST_INSTALL_PACKAGES",
              "SYSTEM_ALERT_WINDOW", "BIND_ACCESSIBILITY_SERVICE",
              "POST_NOTIFICATIONS", "VIBRATE",
              "SCHEDULE_EXACT_ALARM", "RECEIVE_BOOT_COMPLETED"
          ]

          for permission in permissions:
              pattern = (
                  r'\s*<uses-permission\s+'
                  r'android:name="android\.permission\.'
                  + permission + r'"\s*/>'
              )
              text = re.sub(pattern, '', text)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Unnecessary permissions removed.")
          PY


      # ==========================================
      # ADD PERMISSIONS (INTERNET)
      # ==========================================
      - name: Add permissions
        run: |
          python3 - <<'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          extras = ""
          for perm in [
              "android.permission.INTERNET"
          ]:
              if perm not in text:
                  extras += f'    <uses-permission android:name="{perm}" />\n'

          if extras:
              text = text.replace('<application', extras + '    <application', 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("INTERNET permission added.")
          PY


      # ==========================================
      # INSTALL PILLOW
      # ==========================================
      - name: Install Pillow
        run: python3 -m pip install pillow


      # ==========================================
      # FIND ICONS
      # ==========================================
      - name: Find icons
        run: |
          python3 - <<'PY'
          import os

          extensions = (".png", ".jpg", ".jpeg", ".webp")

          icon_file = None
          if os.path.exists("icon.png"):
              icon_file = "icon.png"
          else:
              files = [f for f in os.listdir(".")
                       if os.path.isfile(f) and f.lower().endswith(extensions)]
              if files:
                  icon_file = files[0]

          if not icon_file:
              raise SystemExit("❌ No launcher icon found! Please add icon.png")

          print("=" * 50)
          print("LAUNCHER ICON:", icon_file)
          print("=" * 50)

          with open("CUSTOM_ICON", "w") as f:
              f.write(icon_file)
          PY


      # ==========================================
      # GENERATE LAUNCHER ICONS
      # ==========================================
      - name: Generate launcher icons
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os

          with open("CUSTOM_ICON", "r") as f:
              filename = f.read().strip()

          print("Loading launcher icon:", filename)

          source = Image.open(filename).convert("RGBA")

          sizes = {
              "mdpi": 48, "hdpi": 72, "xhdpi": 96,
              "xxhdpi": 144, "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = "android/app/src/main/res/mipmap-" + density
              os.makedirs(folder, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder + "/ic_launcher.png")
              icon.save(folder + "/ic_launcher_round.png")
              icon.save(folder + "/ic_launcher_foreground.png")

          print("✅ Launcher icons created from", filename)
          PY


      # ==========================================
      # REMOVE ADAPTIVE ICONS
      # ==========================================
      - name: Remove adaptive icon defaults
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml


      # ==========================================
      # VERIFY
      # ==========================================
      - name: Verify icons
        run: |
          echo "=========================================="
          echo "LAUNCHER ICONS"
          echo "=========================================="
          find android/app/src/main/res -name "ic_launcher*.png" | sort


      # ==========================================
      # BUILD APK
      # ==========================================
      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon


      # ==========================================
      # BUILD AAB
      # ==========================================
      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon


      # ==========================================
      # PREPARE RELEASE
      # ==========================================
      - name: Prepare release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/Story-of-an-Empire.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/Story-of-an-Empire.aab
          echo "Release prepared."


      # ==========================================
      # UPLOAD
      # ==========================================
      - name: Upload release
        uses: actions/upload-artifact@v6
        with:
          name: Story-of-an-Empire-v${{ env.VERSION_NAME }}
          path: release/
          if-no-files-found: error


      # ==========================================
      # CLEANUP
      # ==========================================
      - name: Cleanup
        if: always()
        run: |
          rm -f StoryOfAnEmpire.keystore
          rm -f android/app/StoryOfAnEmpire.keystore
          rm -f CUSTOM_ICON
